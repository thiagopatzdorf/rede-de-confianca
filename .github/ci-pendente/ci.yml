name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sem "tests/" no fim: no Node 22 `node --test tests/` trata a pasta como módulo.
      - run: node --test
